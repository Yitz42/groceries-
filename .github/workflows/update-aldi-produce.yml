name: Update ALDI produce prices
on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices and rebuild the list
        run: |
          python3 scripts/fetch_aldi_produce.py --csv aldi-produce.csv --json aldi-produce.json
          python3 scripts/build_md.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update ALDI produce prices $(date -u +%F)" && git push)
